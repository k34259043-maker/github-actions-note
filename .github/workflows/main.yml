name: Note Workflow

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "記事のテーマ"
        required: true
        default: "GitHub Actionsの活用方法"

      target:
        description: "想定読者"
        required: true
        default: "エンジニア初心者"

      message:
        description: "伝えたい核メッセージ"
        required: true
        default: "自動化で生産性向上"

      cta:
        description: "読後のアクション"
        required: true
        default: "実際に試してみる"

      tags:
        description: "カンマ区切りのタグ"
        required: true
        default: "GitHub,自動化,AI"

      is_public:
        description: "公開指定（このワークフローは下書き保存のみ。指定値は記録）"
        required: true
        type: boolean
        default: false

      dry_run:
        description: "テスト実行？（trueなら投稿しない）"
        required: true
        type: boolean
        default: true

jobs:
  note:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        if: ${{ !inputs.dry_run }}
        run: npx playwright install --with-deps chromium

      - name: Restore Note login state
        if: ${{ !inputs.dry_run }}
        env:
          NOTE_STATE_BASE64: ${{ secrets.NOTE_STATE_BASE64 }}
        run: |
          if [ -n "$NOTE_STATE_BASE64" ]; then
            umask 077
            printf '%s' "$NOTE_STATE_BASE64" | base64 --decode > note-state.json
          fi

      - name: Run Note Workflow
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THEME: ${{ inputs.theme }}
          TARGET: ${{ inputs.target }}
          MESSAGE: ${{ inputs.message }}
          CTA: ${{ inputs.cta }}
          TAGS: ${{ inputs.tags }}
          IS_PUBLIC: ${{ inputs.is_public }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPORT_OUTPUT_DIR: output/runs
        run: node note-workflow.mjs

      - name: Upload evaluation and revision reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: note-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/runs/
          if-no-files-found: warn

      - name: Remove temporary login state
        if: ${{ always() }}
        run: rm -f note-state.json
