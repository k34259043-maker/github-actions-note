name: Note Workflow

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "記事のテーマ"
        required: true
        default: "GitHub Actionsの活用方法"

      target:
        description: "想定読者"
        required: true
        default: "エンジニア初心者"

      message:
        description: "伝えたい核メッセージ"
        required: true
        default: "自動化で生産性向上"

      cta:
        description: "読後のアクション"
        required: true
        default: "実際に試してみる"

      tags:
        description: "カンマ区切りのタグ"
        required: true
        default: "GitHub,自動化,AI"

      is_public:
        description: "公開する？"
        required: true
        type: boolean
        default: false

      dry_run:
        description: "テスト実行？（trueなら投稿しない）"
        required: true
        type: boolean
        default: true

jobs:
  note:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Restore Note login state
        env:
          NOTE_STATE_BASE64: ${{ secrets.NOTE_STATE_BASE64 }}
        run: |
          echo "$NOTE_STATE_BASE64" | base64 -d > note-state.json

      - name: Run Note Workflow
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THEME: ${{ inputs.theme }}
          TARGET: ${{ inputs.target }}
          MESSAGE: ${{ inputs.message }}
          CTA: ${{ inputs.cta }}
          TAGS: ${{ inputs.tags }}
          IS_PUBLIC: ${{ inputs.is_public }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node note-workflow.mjs
